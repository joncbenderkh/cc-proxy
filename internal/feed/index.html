<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#b4552d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>cc-proxy feed</title>
<style>
:root {
  --bg: #f6f5f2; --surface: #ffffff; --text: #1d1c1a; --muted: #6b6862;
  --border: #e3e0da; --user: #eef3fb; --tool: #f3f1ec; --accent: #b4552d;
  --ok: #2e7d4f; --bad: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161514; --surface: #1f1e1c; --text: #ecebe8; --muted: #9c998f;
    --border: #34322e; --user: #1f2a3a; --tool: #2a2825; --accent: #e08a5f;
    --ok: #6cc28f; --bad: #f2877e;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  position: sticky; top: 0; z-index: 1; background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
h1 { font-size: 16px; margin: 0; }
#dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
#dot.live { background: var(--ok); }
#back { color: var(--accent); text-decoration: none; font-size: 22px; line-height: 1; padding: 0 4px; }
#heading { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#total { color: var(--muted); font-variant-numeric: tabular-nums; }
#notify {
  font: inherit; font-size: 13px; color: var(--accent); background: none;
  border: 1px solid var(--accent); border-radius: 999px; padding: 2px 10px;
}
.session {
  display: block; color: inherit; text-decoration: none;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 10px;
}
.session.attention { border-color: var(--accent); }
.session .top { display: flex; gap: 8px; align-items: baseline; }
.session .project { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session .title {
  margin: 2px 0 4px; overflow: hidden; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2;
}
.session .title.none { color: var(--muted); font-style: italic; }
.badge {
  flex: none; font-size: 12px; border-radius: 999px; padding: 1px 8px;
  border: 1px solid var(--border); color: var(--muted);
}
.badge.attention { background: var(--accent); border-color: var(--accent); color: #fff; }
.badge.working { color: var(--ok); border-color: var(--ok); }
main { max-width: 760px; margin: 0 auto; padding: 12px 16px 48px; }
.turn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 12px; overflow-wrap: anywhere;
}
.meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.meta .err { color: var(--bad); font-weight: 600; }
.block { margin-top: 8px; white-space: pre-wrap; }
.user { background: var(--user); border-radius: 8px; padding: 6px 8px; }
.tool, .result {
  background: var(--tool); border-radius: 8px; padding: 6px 8px;
  font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
}
.tool b { color: var(--accent); }
.result.error { border-left: 3px solid var(--bad); }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
#empty { color: var(--muted); text-align: center; margin-top: 40px; }
#dock { position: sticky; bottom: 0; padding-bottom: env(safe-area-inset-bottom); }
.approval {
  background: var(--surface); border: 2px solid var(--accent); border-radius: 10px;
  padding: 10px 12px; margin-top: 12px; overflow-wrap: anywhere;
  box-shadow: 0 -4px 16px rgb(0 0 0 / 0.15);
}
.approval .tool { margin-top: 8px; }
.actions { display: flex; gap: 8px; margin-top: 10px; }
.actions button {
  flex: 1; font: inherit; border-radius: 8px; padding: 10px 6px;
  border: 1px solid var(--border); background: var(--tool); color: var(--text);
}
.actions .allow { background: var(--ok); border-color: var(--ok); color: #fff; }
.actions .deny { color: var(--bad); }
.actions button:disabled { opacity: 0.5; }
.approval .err, #composer .err { color: var(--bad); font-size: 13px; margin-top: 6px; }
#composer {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; margin-top: 12px; box-shadow: 0 -4px 16px rgb(0 0 0 / 0.1);
}
#composer textarea {
  display: block; width: 100%; margin-top: 8px; resize: vertical; font: inherit;
  color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px;
}
</style>
</head>
<body>
<header>
  <span id="dot" title="disconnected"></span>
  <a id="back" href="#" aria-label="All sessions" hidden>‹</a>
  <h1 id="heading">cc-proxy</h1>
  <span id="total"></span>
  <button id="notify" type="button" hidden>Notify me</button>
</header>
<main>
  <p id="empty">Waiting for Claude Code traffic…</p>
  <nav id="sessions" aria-label="Sessions"></nav>
  <div id="turns"></div>
  <div id="dock">
    <section id="approvals" aria-live="assertive"></section>
    <form id="composer" hidden>
      <div class="meta"><span>Claude is waiting for your next prompt</span><span id="composer-cwd"></span></div>
      <textarea id="prompt" rows="3" placeholder="Next prompt" aria-label="Next prompt" required></textarea>
      <div class="actions"><button class="allow" type="submit">Send</button></div>
      <div class="err"></div>
    </form>
  </div>
</main>
<script>
"use strict";
const turns = [];
const sessions = new Map();
const list = document.getElementById("turns");
const sessionList = document.getElementById("sessions");
const heading = document.getElementById("heading");
const back = document.getElementById("back");
let pending = [];
const total = document.getElementById("total");
const dot = document.getElementById("dot");
const FOLD = 600;
const approvals = document.getElementById("approvals");
const seenApprovals = new Set();
const composer = document.getElementById("composer");
const promptBox = document.getElementById("prompt");
let idle = [];

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function folded(className, text) {
  if (text.length <= FOLD) return el("div", "block " + className, text);
  const details = el("details", "block " + className);
  details.append(el("summary", "", text.slice(0, 120).replace(/\s+/g, " ") + "…"), text);
  return details;
}

function toolSummary(block) {
  const input = block.input || {};
  const key = ["command", "file_path", "pattern", "url", "query", "description", "prompt"].find(k => typeof input[k] === "string");
  if (key) return input[key];
  const json = JSON.stringify(input);
  return json.length > 300 ? json.slice(0, 300) + "…" : json;
}

function shortModel(model) {
  return (model || "").replace(/^claude-/, "");
}

function usd(value) {
  return "$" + value.toFixed(value < 1 ? 4 : 2);
}

function render(turn) {
  const card = el("article", "turn");
  const meta = el("div", "meta");
  meta.append(el("span", "", new Date(turn.time).toLocaleTimeString()));
  const message = turn.message;
  if (message) {
    const u = message.usage;
    meta.append(
      el("span", "", shortModel(message.model)),
      el("span", "", (u.input_tokens + u.cache_creation_input_tokens + u.cache_read_input_tokens).toLocaleString() + " in · " + u.output_tokens.toLocaleString() + " out"),
    );
    if (message.cost_usd !== undefined) meta.append(el("span", "", usd(message.cost_usd)));
    if (message.stop_reason) meta.append(el("span", "", message.stop_reason));
  }
  if (turn.status !== 200) meta.append(el("span", "err", "HTTP " + turn.status));
  meta.append(el("span", "", (turn.duration_ms / 1000).toFixed(1) + " s"));
  card.append(meta);

  for (const block of turn.prompt || []) {
    if (block.type === "text") card.append(folded("user", block.text));
    else if (block.type === "tool_result") card.append(folded("result" + (block.is_error ? " error" : ""), block.text || "(no output)"));
    else card.append(el("div", "block user", "[" + block.type + "]"));
  }
  for (const block of turn.reply || []) {
    if (block.type === "text") card.append(folded("", block.text));
    else {
      const tool = el("div", "block tool");
      tool.append(el("b", "", block.name), " " + toolSummary(block));
      card.append(tool);
    }
  }
  return card;
}

function selectedSession() {
  const match = location.hash.match(/^#s=(.+)$/);
  return match ? decodeURIComponent(match[1]) : "";
}

function project(session) {
  if (session.cwd) return session.cwd.replace(/\/+$/, "").split("/").pop() || session.cwd;
  return "Session " + session.id.slice(0, 8);
}

function ago(time) {
  const seconds = Math.max(0, (Date.now() - new Date(time)) / 1000);
  if (seconds < 60) return "just now";
  if (seconds < 3600) return Math.floor(seconds / 60) + " min ago";
  if (seconds < 86400) return Math.floor(seconds / 3600) + " h ago";
  return new Date(time).toLocaleDateString();
}

function status(session) {
  const approvals = pending.filter(request => request.session_id === session.id).length;
  if (approvals) return { label: approvals > 1 ? approvals + " approvals" : "Needs approval", kind: "attention" };
  if (idle.some(entry => entry.session_id === session.id)) return { label: "Waiting for prompt", kind: "attention" };
  if (session.stop === "tool_use" && Date.now() - new Date(session.last) < 5 * 60 * 1000) return { label: "Working", kind: "working" };
  return { label: "Idle", kind: "" };
}

function renderSession(session) {
  const state = status(session);
  const card = el("a", "session" + (state.kind === "attention" ? " attention" : ""));
  card.href = "#s=" + encodeURIComponent(session.id);
  const top = el("div", "top");
  top.append(el("span", "project", project(session)), el("span", "badge " + state.kind, state.label));
  card.append(top, el("div", "title" + (session.title ? "" : " none"), session.title || "No prompt yet"));
  const meta = el("div", "meta");
  meta.append(el("span", "", ago(session.last)));
  if (session.turns) meta.append(el("span", "", session.turns + (session.turns === 1 ? " turn" : " turns")));
  if (session.cost) meta.append(el("span", "", usd(session.cost)));
  if (session.model) meta.append(el("span", "", shortModel(session.model)));
  meta.append(el("span", "", session.id.slice(0, 8)));
  card.append(meta);
  if (session.cwd) card.title = session.cwd;
  return card;
}

function showSessions() {
  const all = [...sessions.values()];
  const urgent = session => status(session).kind === "attention" ? 1 : 0;
  all.sort((a, b) => urgent(b) - urgent(a) || new Date(b.last) - new Date(a.last));
  sessionList.replaceChildren(...all.map(renderSession));
  const cost = all.reduce((sum, session) => sum + session.cost, 0);
  total.textContent = all.length ? usd(cost) : "";
  document.getElementById("empty").hidden = all.length > 0;
}

function redraw() {
  const id = selectedSession();
  const session = sessions.get(id);
  back.hidden = !id;
  sessionList.hidden = !!id;
  list.hidden = !id;
  if (!id) {
    heading.textContent = "cc-proxy";
    list.replaceChildren();
    showSessions();
  } else {
    heading.textContent = session ? project(session) + (session.title ? " · " + session.title : "") : "Session " + id.slice(0, 8);
    const shown = turns.filter(turn => turn.session_id === id);
    list.replaceChildren(...shown.map(render));
    total.textContent = session && session.cost ? usd(session.cost) : "";
    document.getElementById("empty").hidden = shown.length > 0;
  }
  showComposer();
}

function showComposer() {
  const waiting = idle.find(session => session.session_id === selectedSession());
  composer.hidden = !waiting;
  document.getElementById("composer-cwd").textContent = waiting ? waiting.cwd || "" : "";
}

async function sendPrompt(event) {
  event.preventDefault();
  const session = selectedSession();
  const button = composer.querySelector("button");
  const error = composer.querySelector(".err");
  button.disabled = true;
  error.textContent = "";
  try {
    const response = await fetch("prompts/" + encodeURIComponent(session), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: promptBox.value }),
    });
    if (!response.ok) throw new Error((await response.text()).trim() || "HTTP " + response.status);
    promptBox.value = "";
  } catch (failure) {
    error.textContent = failure.message;
  } finally {
    button.disabled = false;
  }
}

// track folds a turn, an idle entry or an approval request into the
// summary of its session.
function track(entry, isTurn) {
  if (!entry.session_id) return;
  let session = sessions.get(entry.session_id);
  if (!session) {
    session = { id: entry.session_id, cwd: "", title: "", last: entry.time, turns: 0, cost: 0, model: "", stop: "" };
    sessions.set(entry.session_id, session);
  }
  if (new Date(entry.time) > new Date(session.last)) session.last = entry.time;
  if (!session.cwd && entry.cwd) session.cwd = entry.cwd;
  if (!isTurn) return;
  if (!session.title && entry.title && entry.cwd) session.title = entry.title;
  session.turns++;
  const message = entry.message;
  if (message) {
    session.cost += message.cost_usd || 0;
    session.model = message.model;
    session.stop = message.stop_reason || "";
  }
}

function ruleText(entry) {
  return (entry.rules || []).map(rule => rule.ruleContent ? rule.toolName + "(" + rule.ruleContent + ")" : rule.toolName).join(", ");
}

async function decide(card, id, behavior, always) {
  const buttons = card.querySelectorAll("button");
  buttons.forEach(button => { button.disabled = true; });
  try {
    const response = await fetch("approvals/" + encodeURIComponent(id), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ behavior, always }),
    });
    if (!response.ok) throw new Error((await response.text()).trim() || "HTTP " + response.status);
  } catch (error) {
    buttons.forEach(button => { button.disabled = false; });
    card.querySelector(".err").textContent = error.message;
  }
}

function renderApproval(request) {
  const card = el("article", "approval");
  const meta = el("div", "meta");
  meta.append(el("span", "", new Date(request.time).toLocaleTimeString()));
  const session = sessions.get(request.session_id);
  if (session) meta.append(el("span", "", project(session)));
  else if (request.session_id) meta.append(el("span", "", request.session_id.slice(0, 8)));
  if (request.cwd) meta.append(el("span", "", request.cwd));
  const tool = el("div", "block tool");
  tool.append(el("b", "", request.tool_name), " " + toolSummary({ input: request.tool_input }));
  const input = el("details", "block");
  input.append(el("summary", "", "Full input"), el("div", "block result", JSON.stringify(request.tool_input, null, 2)));
  const actions = el("div", "actions");
  const deny = el("button", "deny", "Deny");
  deny.onclick = () => decide(card, request.id, "deny", false);
  const allow = el("button", "allow", "Allow");
  allow.onclick = () => decide(card, request.id, "allow", false);
  actions.append(deny, allow);
  const rules = (request.always || []).map(ruleText).filter(Boolean).join(", ");
  if (rules) {
    const always = el("button", "", "Always allow");
    always.title = rules;
    always.onclick = () => decide(card, request.id, "allow", true);
    actions.append(always);
  }
  card.append(meta, tool, input, actions, el("div", "err"));
  return card;
}

function showApprovals() {
  approvals.replaceChildren(...pending.map(renderApproval));
  document.title = pending.length ? "(" + pending.length + ") cc-proxy" : "cc-proxy feed";
  if (pending.some(request => !seenApprovals.has(request.id))) {
    if (navigator.vibrate) navigator.vibrate(200);
    window.scrollTo(0, document.body.scrollHeight);
  }
  pending.forEach(request => seenApprovals.add(request.id));
}

// Push notifications need a service worker, which browsers only allow in
// a secure context (https, or localhost); iOS offers push only to a page
// added to the Home Screen.
const notifyButton = document.getElementById("notify");

function base64url(text) {
  const binary = atob(text.replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(binary, c => c.charCodeAt(0));
}

async function saveSubscription(subscription, confirm) {
  const response = await fetch("push/subscriptions" + (confirm ? "?confirm=1" : ""), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(subscription),
  });
  if (!response.ok) throw new Error((await response.text()).trim() || "HTTP " + response.status);
}

async function enableNotifications() {
  notifyButton.disabled = true;
  try {
    if (await Notification.requestPermission() !== "granted") throw new Error("Notifications are blocked for this site.");
    const registration = await navigator.serviceWorker.ready;
    const { key } = await (await fetch("push/key")).json();
    const subscription = await registration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: base64url(key) });
    await saveSubscription(subscription, true);
    notifyButton.hidden = true;
  } catch (failure) {
    notifyButton.title = failure.message;
    notifyButton.textContent = "Notify me (failed)";
  } finally {
    notifyButton.disabled = false;
  }
}

async function setUpNotifications() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !window.isSecureContext) return;
  navigator.serviceWorker.addEventListener("message", event => {
    if (event.data && typeof event.data.hash === "string") location.hash = event.data.hash;
  });
  const registration = await navigator.serviceWorker.register("sw.js");
  const subscription = await registration.pushManager.getSubscription();
  if (subscription && Notification.permission === "granted") {
    // Resend it, in case the server lost it or the browser rotated it.
    await saveSubscription(subscription, false);
    return;
  }
  notifyButton.hidden = false;
  notifyButton.onclick = enableNotifications;
}

setUpNotifications().catch(() => {});
window.addEventListener("hashchange", () => { redraw(); window.scrollTo(0, selectedSession() ? document.body.scrollHeight : 0); });
setInterval(() => { if (!selectedSession()) showSessions(); }, 30000);
composer.addEventListener("submit", sendPrompt);
promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) composer.requestSubmit();
});

const nearBottom = () => window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
const events = new EventSource("events");
events.onopen = () => { dot.className = "live"; dot.title = "live"; };
events.onerror = () => { dot.className = ""; dot.title = "reconnecting"; };
events.addEventListener("approvals", event => {
  pending = JSON.parse(event.data);
  pending.forEach(request => track(request, false));
  showApprovals();
  if (!selectedSession()) showSessions();
});
events.addEventListener("idle", event => {
  idle = JSON.parse(event.data);
  idle.forEach(entry => track(entry, false));
  if (!selectedSession()) showSessions();
  showComposer();
});
events.addEventListener("turn", event => {
  const follow = nearBottom();
  const turn = JSON.parse(event.data);
  turns.push(turn);
  track(turn, true);
  redraw();
  if (follow && selectedSession()) window.scrollTo(0, document.body.scrollHeight);
});
redraw();
</script>
</body>
</html>
