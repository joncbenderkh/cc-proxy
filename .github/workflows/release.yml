name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify tag matches VERSION
        run: |
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION ($expected)"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Build release archives
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="cc-proxy_${GITHUB_REF_NAME#v}_${os}_${arch}"
            bin="cc-proxy"; [ "$os" = windows ] && bin="cc-proxy.exe"
            mkdir -p "build/$name"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "build/$name/$bin" .
            cp LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
